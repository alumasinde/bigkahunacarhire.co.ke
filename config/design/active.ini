[application]
style_version = "v1"

[font]
body_family = "Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif"
heading_family = "Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif"
body_weight = "400"
font_css_url = "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"

[brand]
primary = "#111516"
primary_hover = "#191D1E"
secondary = "#D9A52E"
secondary_hover = "#B88416"
accent = "#D9A52E"

[text]
primary = "#1B2021"
secondary = "#4F5557"
muted = "#6B7072"
inverse = "#FFFFFF"
link = "#111516"

[surface]
page = "#F7F6F2"
base = "#FFFFFF"
subtle = "#F5F4F0"
dark = "#111516"

[layout]
content_width = "1240px"
header_height = "78px"
container_padding = "28px"

[border]
default = "#E2E1DC"
strong = "#C9C8C1"
radius_sm = "8px"
radius_md = "12px"
radius_lg = "20px"

[spacing]
xs = "4px"
sm = "8px"
md = "16px"
lg = "24px"
xl = "40px"
xxl = "72px"
